name: Replace whisper image reference

on:
  push:
    paths:
      - '.github/workflows/replace-whisper-image.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i 's/2.jpg/whisper-in-the-dark.webp/g' index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use optimized whisper image"
          git push
