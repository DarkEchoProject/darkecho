name: Patch new creepy story image reference

on:
  push:
    paths:
      - '.github/workflows/patch-new-creepy-story.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old creepy story image reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          old = '10 most terrifying horror movies.png'
          new = 'new-creepy-story.webp'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  text2 = text.replace(old, new)
                  path.write_text(text2, encoding='utf-8')
                  changed.append(path.name)
          if not changed:
              raise SystemExit('Old image reference not found')
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Use optimized creepy story image"
          git push
