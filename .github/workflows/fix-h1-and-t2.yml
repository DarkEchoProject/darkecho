name: Fix image references

on:
  push:
    paths:
      - '.github/workflows/fix-h1-and-t2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact image references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="h1.png" alt="Terrifying short story"', 'src="terrifying-short-story.webp" alt="Terrifying short story"')
          s = s.replace('src="twhisper-in-the-dark.webp" alt="Horror Short"', 'src="t2.jpg" alt="Horror Short"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use optimized terrifying story image and restore t2 image"
          git push
