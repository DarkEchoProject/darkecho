name: Patch more-videos metadata and navigation

on:
  push:
    paths:
      - '.github/workflows/patch-more-videos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch more-videos.html safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('more-videos.html')
          text = path.read_text(encoding='utf-8')

          old_meta = '''  <meta property="og:type" content="website">\n\n  <link rel="icon" type="image/png" href="Dark Echo s.png">'''
          new_meta = '''  <meta property="og:type" content="website">\n  <meta property="og:site_name" content="Dark Echo">\n\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="Dark Echo | More Horror Videos">\n  <meta name="twitter:description" content="More horror shorts and creepy videos from Dark Echo.">\n  <meta name="twitter:image" content="https://darkechoproject.github.io/darkecho/Dark%20Echo.png">\n\n  <link rel="icon" type="image/png" href="Dark Echo s.png">'''
          if old_meta not in text:
              raise SystemExit('Expected metadata block not found')
          text = text.replace(old_meta, new_meta, 1)

          old_nav = '''          <a href="index.html">Home</a>\n          <a href="#shorts">Shorts</a>\n          <a href="#long-videos">Long Videos</a>\n          <a href="#quick-picks">Quick Picks</a>\n          <a href="#join">Subscribe</a>'''
          new_nav = '''          <a href="index.html">Home</a>\n          <a href="blog.html">Blog</a>\n          <a href="about.html">About</a>\n          <a href="#shorts">Shorts</a>\n          <a href="#long-videos">Long Videos</a>\n          <a href="#quick-picks">Quick Picks</a>\n          <a href="#join">Subscribe</a>\n          <a href="contact.html">Contact</a>\n          <a href="privacy.html">Privacy</a>'''
          if old_nav not in text:
              raise SystemExit('Expected navigation block not found')
          text = text.replace(old_nav, new_nav, 1)

          old_footer = '''      © 2026 Dark Echo — More Videos'''
          new_footer = '''      © 2026 Dark Echo — More Videos · <a href="blog.html">Blog</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy</a>'''
          if old_footer not in text:
              raise SystemExit('Expected footer text not found')
          text = text.replace(old_footer, new_footer, 1)

          counter = '''\n  <script type="text/javascript" src="https://counter.websiteout.net/js/36/6/0/0"></script>'''
          if counter not in text:
              raise SystemExit('Expected counter script not found')
          text = text.replace(counter, '', 1)

          iframe_old = '''        <iframe\n          id="main-video"'''
          iframe_new = '''        <iframe loading="lazy"\n          id="main-video"'''
          if iframe_old in text:
              text = text.replace(iframe_old, iframe_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add more-videos.html
          git commit -m "Improve more videos metadata and navigation"
          git push
